{% extends "layout.html" %}
{% block content %}
<h1>欢迎来到校园二手交易平台</h1>
<p>本项目实现了一个满足作业要求的数据库管理系统，涵盖商品浏览、交易模拟及数据统计分析。</p>
<div style="margin-top: 20px;">
    <h3>主要功能：</h3>
    <ul>
        <li><strong>商品管理</strong>：浏览、筛选并模拟购买操作。</li>
        <li><strong>用户与订单</strong>：查看平台注册用户及所有成交历史。</li>
        <li><strong>数据分析</strong>：实时计算商品均价、分类统计及活跃用户。</li>
    </ul>
</div>
